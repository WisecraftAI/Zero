# S7 — Web image. Static SPA only. No /api proxy: the browser talks to
# the API service directly at http://localhost:3001 (see web/src/apiBase.js).

worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 3000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. nginx otherwise rebuilds an absolute URL
    # from its own listen port, which is wrong behind a proxy or load balancer.
    absolute_redirect off;

    # Long-cache fingerprinted assets, no-cache the shell.
    location /assets/ {
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location = /health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # The landing page is the only publicly indexable URL, and the shell HTML
    # is built with its metadata, so it is served without a robots header.
    location = / {
      add_header Cache-Control "no-store";
      try_files /index.html =404;
    }

    # Legacy alias for the landing page. A 301 consolidates ranking signals on
    # "/" instead of serving byte-identical content under two URLs.
    location = /home {
      return 301 /;
    }

    # Real files (robots.txt, sitemap.xml, icons) are served as themselves.
    # Anything else is a client-side route and falls through to the shell.
    location / {
      try_files $uri $uri/ @spa;
      add_header Cache-Control "no-store";
    }

    # SPA fallback. Every deep route returns the same shell, which carries the
    # landing page's metadata — so to a crawler that never runs JavaScript they
    # would all look indexable. A response header outranks the in-HTML tag and
    # applies without a rendering pass.
    location @spa {
      add_header Cache-Control "no-store";
      add_header X-Robots-Tag "noindex, nofollow" always;
      try_files /index.html =404;
    }
  }
}
