# V3 S5 — API + orchestrator + executor images (Playwright only in executor).
# Extra instances: docs (zero-docs nginx) + workflow (milestone probes on live tree).
# Hybrid: docker compose up -d postgres redis minio  →  npm start on host

name: zero

# NODE_ENV stays development: production forces verified auth on /api and refuses
# to boot without a real KEY_ENC_SECRET. For a production-like stack, set
# NODE_ENV=production plus KEY_ENC_SECRET and ZERO_API_KEYS.
x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: "3000"
  ZERO_CLOUD: local
  ZERO_PUBLIC_BASE_URL: http://localhost:3000
  DATABASE_URL: postgres://zero:zero@postgres:5432/zero
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: zero-artifacts
  S3_ACCESS_KEY: zerominio
  S3_SECRET_KEY: zerominio123
  EXECUTION_MODE: minimal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zero
      POSTGRES_PASSWORD: zero
      POSTGRES_DB: zero
    # Host publish is for hybrid (npm start on host). Override if busy, e.g. POSTGRES_PORT=15432
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero -d zero"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zerominio
      MINIO_ROOT_PASSWORD: zerominio123
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 zerominio zerominio123 &&
      mc mb -p local/zero-artifacts || true
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-env
      API_ONLY: "1"
      SKIP_EXECUTION_WORKER: "1"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app-artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  executor:
    build:
      context: .
      dockerfile: apps/executor/Dockerfile
    environment:
      <<: *app-env
      EXECUTION_WORKER_ONLY: "1"
    volumes:
      - app-artifacts:/app/artifacts
    shm_size: 1gb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    environment:
      <<: *app-env
      ORCHESTRATOR_ONLY: "1"
    volumes:
      - app-artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  docs:
    image: node:20-bookworm
    working_dir: /src
    environment:
      CHOKIDAR_USEPOLLING: "1"
    command: >
      sh -c "test -d node_modules/vite || npm ci;
      npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "${DOCS_PORT:-5174}:5174"
    volumes:
      - ./zero-docs:/src
      - docs-nm:/src/node_modules

  workflow:
    build:
      context: .
      dockerfile: agent-workflow/Dockerfile
    environment:
      PORT: "5175"
    ports:
      - "${WORKFLOW_PORT:-5175}:5175"
    # Live repo — detect/verify read apps/ + packages/ from the host
    volumes:
      - .:/repo:ro

volumes:
  pgdata:
  miniodata:
  app-artifacts:
  docs-nm:
