# V3 migration S0 — containerize what exists.
# Monolith app + Postgres / Redis / MinIO. No code moves.
# Extra instances: docs (zero-docs nginx) + workflow (milestone probes on live tree).
# Hybrid: docker compose up -d postgres redis minio  →  npm start on host

name: zero

x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"
  ZERO_CLOUD: local
  ZERO_PUBLIC_BASE_URL: http://localhost:3000
  DATABASE_URL: postgres://zero:zero@postgres:5432/zero
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: zero-artifacts
  S3_ACCESS_KEY: zerominio
  S3_SECRET_KEY: zerominio123
  EXECUTION_MODE: minimal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zero
      POSTGRES_PASSWORD: zero
      POSTGRES_DB: zero
    # Host publish is for hybrid (npm start on host). Override if busy, e.g. POSTGRES_PORT=15432
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero -d zero"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zerominio
      MINIO_ROOT_PASSWORD: zerominio123
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 zerominio zerominio123 &&
      mc mb -p local/zero-artifacts || true
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app-artifacts:/app/artifacts
    # Chromium needs >64MB /dev/shm (see architecture.html V3 compose note)
    shm_size: 1gb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  docs:
    build:
      context: ./zero-docs
      dockerfile: Dockerfile
    ports:
      - "${DOCS_PORT:-5174}:80"

  workflow:
    build:
      context: .
      dockerfile: agent-workflow/Dockerfile
    environment:
      PORT: "5175"
    ports:
      - "${WORKFLOW_PORT:-5175}:5175"
    # Live repo — detect/verify read server.js + lib/ from the host, not a baked snapshot
    volumes:
      - .:/repo:ro

volumes:
  pgdata:
  miniodata:
  app-artifacts:
