# V3 S7 — web + API + orchestrator + executor images. The SPA runs as its
# own nginx container (`zero-web`) on :3000. The API service (`zero-api`)
# listens on :3001. Chromium remains executor-only. Extra instances: docs
# (zero-docs Vite) + workflow (milestone probes on live tree).
# Hybrid: docker compose up -d postgres redis → npm run start:all on host
# Optional S3 drill: docker compose --profile s3 up -d minio minio-init

name: zero

# NODE_ENV stays development: production forces verified auth on /api and refuses
# to boot without a real KEY_ENC_SECRET. For a production-like stack, set
# NODE_ENV=production plus KEY_ENC_SECRET and ZERO_API_KEYS.
x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: "3001"
  ZERO_CLOUD: local
  # Signed URLs point at the API service origin (browser talks to it directly).
  ZERO_PUBLIC_BASE_URL: http://localhost:3001
  ZERO_WEB_URL: http://localhost:3000
  DATABASE_URL: postgres://zero:zero@postgres:5432/zero
  REDIS_URL: redis://redis:6379
  EXECUTION_MODE: minimal
  # Optional — enable LLM from .env without UI keys (see .env.example):
  # ZERO_LLM_ENV_KEYS: ${ZERO_LLM_ENV_KEYS:-}
  # GEMINI_API_KEY: ${GEMINI_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zero
      POSTGRES_PASSWORD: zero
      POSTGRES_DB: zero
    # Host publish is for hybrid (npm start on host). Override if busy, e.g. POSTGRES_PORT=15432
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero -d zero"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zerominio
      MINIO_ROOT_PASSWORD: zerominio123
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    profiles: ["s3"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 zerominio zerominio123 &&
      mc mb -p local/zero-artifacts || true
      "
    restart: "no"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the Vite bundle at build time; matches the api service publish.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    image: zero-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: zero-api
    environment:
      <<: *app-env
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - app-artifacts:/app/dist/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  executor:
    build:
      context: .
      dockerfile: services/executor/Dockerfile
    image: zero-executor
    environment:
      <<: *app-env
    volumes:
      - app-artifacts:/app/dist/artifacts
    shm_size: 1gb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    image: zero-orchestrator
    environment:
      <<: *app-env
    volumes:
      - app-artifacts:/app/dist/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  docs:
    image: node:20-bookworm
    working_dir: /src
    environment:
      CHOKIDAR_USEPOLLING: "1"
    command: >
      sh -c "npm ci &&
      npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "${DOCS_PORT:-5174}:5174"
    volumes:
      - ./support/zero-docs:/src
      - docs-nm:/src/node_modules

  workflow:
    build:
      context: .
      dockerfile: support/agent-workflow/Dockerfile
    environment:
      PORT: "5175"
    ports:
      - "${WORKFLOW_PORT:-5175}:5175"
    # Live repo — detect/verify read services/ + packages/ from the host
    volumes:
      - .:/repo:ro

volumes:
  pgdata:
  miniodata:
  app-artifacts:
  docs-nm:
